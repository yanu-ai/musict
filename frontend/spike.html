<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>musict spike: demucs-web</title>
    <!-- Throwaway experiment page. Not part of the app and not deployed (only index.html is built). -->
    <style>
      body { background: #20222c; color: #eceef5; font: 14px/1.5 system-ui, sans-serif; max-width: 760px; margin: 32px auto; padding: 0 16px; }
      h1 { font-size: 18px; }
      label { display: block; margin: 10px 0; color: #9097ab; }
      input, select, button { font: inherit; }
      button { background: #7fe0d0; color: #181a22; border: 0; border-radius: 6px; padding: 8px 16px; font-weight: 600; cursor: pointer; }
      button:disabled { opacity: 0.4; cursor: default; }
      pre { background: #181a22; padding: 12px; border-radius: 6px; white-space: pre-wrap; min-height: 120px; font: 12px/1.6 ui-monospace, monospace; }
      .stem { display: flex; align-items: center; gap: 12px; margin: 6px 0; }
      .stem span { width: 70px; }
    </style>
  </head>
  <body>
    <h1>Spike: separate a clip with demucs-web</h1>
    <label>Audio file <input id="file" type="file" accept="audio/*,video/*" /></label>
    <label>Start at (seconds) <input id="start" type="number" value="30" min="0" step="1" /></label>
    <label>Clip length (seconds) <input id="length" type="number" value="30" min="5" max="600" step="5" /></label>
    <label>
      Backend
      <select id="backend">
        <option value="webgpu">WebGPU (GPU)</option>
        <option value="wasm">WebAssembly (CPU)</option>
      </select>
    </label>
    <button id="run" disabled>Separate</button>
    <h2>Log</h2>
    <pre id="log"></pre>
    <div id="stems"></div>
    <script type="module" src="/src/spike.ts"></script>
  </body>
</html>
